<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="96" fill="#FAF7F0"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2D5016" stroke-width="3" opacity="0.15"/>

  <ellipse cx="90" cy="178" rx="30" ry="6" fill="#8B4513" opacity="0.18"/>

  <!-- long straight shaft, diagonal like the reference -->
  <g>
    <rect x="96" y="52" width="8" height="118" rx="4" fill="#C9CBCC" transform="rotate(18 100 100)"/>

    <!-- engine head top-right -->
    <g transform="rotate(18 100 100) translate(70 -14)">
      <rect x="18" y="10" width="40" height="30" rx="6" fill="#E8720C"/>
      <rect x="26" y="0" width="14" height="14" rx="2" fill="#232323"/>
      <circle cx="46" cy="14" r="5" fill="#D4A017"/>
    </g>

    <!-- forked handle (bike-style) -->
    <g transform="rotate(18 100 100)">
      <path d="M92 96 h-26" stroke="#232323" stroke-width="6" stroke-linecap="round"/>
      <path d="M92 96 h30" stroke="#232323" stroke-width="6" stroke-linecap="round"/>
      <circle cx="66" cy="96" r="6" fill="#E8720C"/>
      <circle cx="122" cy="96" r="6" fill="#E8720C"/>
    </g>

    <!-- guard + cutter head bottom-left -->
    <g transform="rotate(18 100 100) translate(-38 60)">
      <path d="M60 100 q-26 -4 -34 14 l40 6 q6 -12 -6 -20 z" fill="#E8720C"/>
      <circle cx="60" cy="112" r="8" fill="#232323"/>
      <line x1="40" y1="118" x2="30" y2="126" stroke="#232323" stroke-width="2.5"/>
      <line x1="48" y1="122" x2="40" y2="132" stroke="#232323" stroke-width="2.5"/>
    </g>
  </g>
</svg>
