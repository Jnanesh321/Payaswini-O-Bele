<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="96" fill="#FAF7F0"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2D5016" stroke-width="3" opacity="0.15"/>

  <ellipse cx="100" cy="178" rx="34" ry="6" fill="#8B4513" opacity="0.18"/>

  <!-- straight vertical telescopic pole, slightly tilted -->
  <g transform="rotate(8 100 100)">
    <!-- lower yellow segment -->
    <rect x="93" y="120" width="14" height="62" rx="4" fill="#D4A017"/>
    <!-- telescopic black segments, ribbed -->
    <rect x="94" y="70" width="12" height="52" rx="3" fill="#232323"/>
    <line x1="94" y1="78" x2="106" y2="78" stroke="#3a3a3a" stroke-width="2"/>
    <line x1="94" y1="86" x2="106" y2="86" stroke="#3a3a3a" stroke-width="2"/>
    <line x1="94" y1="94" x2="106" y2="94" stroke="#3a3a3a" stroke-width="2"/>
    <line x1="94" y1="102" x2="106" y2="102" stroke="#3a3a3a" stroke-width="2"/>
    <line x1="94" y1="110" x2="106" y2="110" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="95" y="42" width="10" height="30" rx="2" fill="#4a4a4a"/>
    <!-- hooked metal harvester head -->
    <path d="M100 42 L100 22 Q100 12 90 14 L78 20" stroke="#B0B0B0" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
