<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="45%" stop-color="#121D2C"/>
      <stop offset="85%" stop-color="#1A2D23"/>
      <stop offset="100%" stop-color="#14261B"/>
    </linearGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE898" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FCD34D" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#121D2C" stop-opacity="0"/>
    </radialGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA826" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF7B00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF7B00" stop-opacity="0"/>
    </radialGradient>

    <!-- Distant Mountain Gradient -->
    <linearGradient id="distMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152622"/>
      <stop offset="100%" stop-color="#0E1A16"/>
    </linearGradient>

    <!-- Hill Gradient -->
    <linearGradient id="nightHill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D3825"/>
      <stop offset="100%" stop-color="#0D1D13"/>
    </linearGradient>
  </defs>

  <!-- Night Sky Backdrop -->
  <rect width="780" height="260" fill="url(#nightSky)"/>

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="65" cy="35" r="1.2"/>
    <circle cx="110" cy="55" r="0.9"/>
    <circle cx="175" cy="28" r="1.4"/>
    <circle cx="240" cy="65" r="0.8"/>
    <circle cx="295" cy="40" r="1.1"/>
    <circle cx="360" cy="22" r="1.3"/>
    <circle cx="430" cy="50" r="0.9"/>
    <circle cx="490" cy="30" r="1.2"/>
    <circle cx="530" cy="70" r="0.8"/>
    <circle cx="585" cy="45" r="1.5"/>
    <circle cx="640" cy="25" r="1.0"/>
    <circle cx="700" cy="60" r="1.2"/>
    <circle cx="745" cy="35" r="0.9"/>
    <circle cx="140" cy="85" r="0.7"/>
    <circle cx="380" cy="75" r="0.8"/>
    <circle cx="670" cy="80" r="0.7"/>
  </g>

  <!-- Glowing Crescent Moon -->
  <circle cx="620" cy="68" r="48" fill="url(#moonGlow)"/>
  <circle cx="620" cy="68" r="22" fill="#FFF3B0"/>
  <circle cx="628" cy="62" r="20" fill="#121D2C"/>

  <!-- Distant Western Ghats Hills (Night Silhouette) -->
  <path d="M 0 160 Q 140 105 280 145 T 560 135 T 780 150 L 780 260 L 0 260 Z" fill="url(#distMountain)" opacity="0.9"/>
  <path d="M 0 175 Q 160 130 340 165 T 660 155 T 780 170 L 780 260 L 0 260 Z" fill="url(#nightHill)"/>

  <!-- Areca & Coconut Tree Silhouettes (Left Grove) -->
  <!-- Tree 1 -->
  <path d="M 50 260 Q 53 180 58 110" stroke="#09140C" stroke-width="4.5" fill="none"/>
  <g transform="translate(58, 110)">
    <path d="M 0 0 Q -25 -20 -40 -10" stroke="#0B1A10" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q -30 0 -45 15" stroke="#0B1A10" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q 25 -20 40 -10" stroke="#0B1A10" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q 30 0 45 15" stroke="#0B1A10" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q 0 -30 10 -40" stroke="#0B1A10" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Tree 2 -->
  <path d="M 90 260 Q 92 170 94 95" stroke="#09140C" stroke-width="4" fill="none"/>
  <g transform="translate(94, 95)">
    <path d="M 0 0 Q -25 -22 -42 -12" stroke="#0E2316" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q -32 5 -46 20" stroke="#0E2316" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q 28 -20 44 -8" stroke="#0E2316" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q 32 6 46 22" stroke="#0E2316" stroke-width="2.5" fill="none"/>
    <path d="M 0 0 Q 2 -32 15 -42" stroke="#0E2316" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Farm Cottage with Warm Light -->
  <g transform="translate(320, 155)">
    <!-- Cottage Shadow -->
    <ellipse cx="40" cy="65" rx="55" ry="12" fill="#060C08"/>
    <!-- Walls -->
    <polygon points="10,35 65,35 65,65 10,65" fill="#1C1812"/>
    <!-- Slanted Roof -->
    <polygon points="5,35 38,12 72,35" fill="#542512"/>
    <polygon points="38,12 72,35 85,32 52,10" fill="#3D1B0D"/>
    <!-- Glowing Window -->
    <rect x="22" y="42" width="14" height="14" rx="2" fill="#FFC837"/>
    <circle cx="29" cy="49" r="22" fill="url(#lanternGlow)"/>
    <!-- Small Door -->
    <rect x="44" y="44" width="12" height="21" rx="1" fill="#0C0A08"/>
  </g>

  <!-- Foreground Areca Tree (Right) -->
  <path d="M 720 260 Q 716 160 710 80" stroke="#060F09" stroke-width="5" fill="none"/>
  <g transform="translate(710, 80)">
    <path d="M 0 0 Q -35 -25 -55 -15" stroke="#0B1A10" stroke-width="3" fill="none"/>
    <path d="M 0 0 Q -40 5 -60 22" stroke="#0B1A10" stroke-width="3" fill="none"/>
    <path d="M 0 0 Q 30 -25 50 -12" stroke="#0B1A10" stroke-width="3" fill="none"/>
    <path d="M 0 0 Q 35 8 52 28" stroke="#0B1A10" stroke-width="3" fill="none"/>
    <path d="M 0 0 Q -5 -35 5 -48" stroke="#0B1A10" stroke-width="3" fill="none"/>
  </g>

  <!-- Fireflies in the Night -->
  <g fill="#A3E635">
    <circle cx="210" cy="195" r="2.2" opacity="0.9"/>
    <circle cx="265" cy="180" r="1.8" opacity="0.8"/>
    <circle cx="420" cy="190" r="2.4" opacity="0.9"/>
    <circle cx="480" cy="210" r="1.6" opacity="0.75"/>
    <circle cx="560" cy="185" r="2.0" opacity="0.85"/>
    <circle cx="160" cy="220" r="1.8" opacity="0.8"/>
  </g>

  <!-- Gentle Foreground Ground Slope -->
  <path d="M 0 220 Q 200 195 420 215 T 780 205 L 780 260 L 0 260 Z" fill="#07120A"/>
</svg>
