  <!-- handlebars -->
  <path d="M126 96 L160 66" stroke="#232323" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 60 h20" stroke="#232323" stroke-width="6" stroke-linecap="round"/>
  <path d="M132 100 L156 84" stroke="#232323" stroke-width="6" stroke-linecap="round"/>

  <!-- rotary tine guard -->
  <path d="M96 124 q22 0 22 20 l-44 0 q0 -20 22 -20 z" fill="#232323"/>

  <!-- kickstand -->
  <path d="M84 124 L74 156" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
</svg>
