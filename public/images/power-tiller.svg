<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="96" fill="#FAF7F0"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2D5016" stroke-width="3" opacity="0.15"/>

  <!-- tilled soil furrows -->
  <path d="M30 172 q15 -7 30 0 t30 0 t30 0 t30 0 t30 0" stroke="#8B4513" stroke-width="4" fill="none" opacity="0.28" stroke-linecap="round"/>

  <!-- rear wheel -->
  <circle cx="140" cy="140" r="26" fill="#232323"/>
  <circle cx="140" cy="140" r="26" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="140" cy="140" r="9" fill="#8B4513"/>

  <!-- red engine body -->
  <rect x="70" y="86" width="58" height="38" rx="10" fill="#C81E1E"/>
  <rect x="70" y="86" width="58" height="38" rx="10" fill="none" stroke="#8f1414" stroke-width="1.5"/>
  <!-- gold accent stripe -->
  <path d="M74 108 L124 96" stroke="#D4A017" stroke-width="4" stroke-linecap="round"/>

  <!-- headlight -->
