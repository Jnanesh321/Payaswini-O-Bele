<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="96" fill="#FAF7F0"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2D5016" stroke-width="3" opacity="0.15"/>
  <ellipse cx="100" cy="176" rx="42" ry="6" fill="#8B4513" opacity="0.18"/>

  <!-- Agricultural Crop Net / Tarpaulin Roll & Drape -->
  <g transform="translate(0, 0)">
    <!-- Support Poles -->
    <rect x="42" y="70" width="6" height="95" rx="3" fill="#8B4513"/>
    <rect x="152" y="70" width="6" height="95" rx="3" fill="#8B4513"/>

    <!-- Green Shade Netting Drape -->
    <path d="M44 75 Q100 92 154 75 L154 135 Q100 152 44 135 Z" fill="#2D5016" opacity="0.85"/>
    <path d="M44 75 Q100 92 154 75" stroke="#1B330E" stroke-width="3" fill="none"/>
    <path d="M44 135 Q100 152 154 135" stroke="#1B330E" stroke-width="3" fill="none"/>

    <!-- Mesh Pattern Lines -->
    <line x1="65" y1="80" x2="65" y2="138" stroke="#417320" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="85" y1="83" x2="85" y2="142" stroke="#417320" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="105" y1="84" x2="105" y2="143" stroke="#417320" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="125" y1="82" x2="125" y2="141" stroke="#417320" stroke-width="1.5" stroke-dasharray="3,3"/>

    <path d="M44 95 Q100 112 154 95" stroke="#417320" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
    <path d="M44 115 Q100 132 154 115" stroke="#417320" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

    <!-- Rolled Net Bundle at Bottom -->
    <rect x="60" y="146" width="80" height="18" rx="8" fill="#1D6FBF"/>
    <ellipse cx="62" cy="155" rx="5" ry="9" fill="#134D87"/>
    <ellipse cx="138" cy="155" rx="5" ry="9" fill="#2E86DE"/>
    <!-- Tie Straps -->
    <rect x="80" y="146" width="4" height="18" fill="#D4A017"/>
    <rect x="115" y="146" width="4" height="18" fill="#D4A017"/>
  </g>
