<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="96" fill="#FAF7F0"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2D5016" stroke-width="3" opacity="0.15"/>

  <ellipse cx="105" cy="178" rx="40" ry="6" fill="#8B4513" opacity="0.18"/>

  <!-- blue tank body -->
  <rect x="70" y="70" width="62" height="88" rx="10" fill="#1D6FBF"/>
  <rect x="70" y="70" width="62" height="88" rx="10" fill="none" stroke="#134d87" stroke-width="1.5"/>
  <!-- vertical rib details -->
  <line x1="82" y1="80" x2="82" y2="148" stroke="#134d87" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="80" x2="120" y2="148" stroke="#134d87" stroke-width="2" opacity="0.4"/>
  <!-- yellow cap top -->
  <rect x="90" y="58" width="24" height="16" rx="3" fill="#D4A017"/>
  <!-- pump handle -->
  <rect x="96" y="66" width="12" height="10" rx="2" fill="#232323"/>

  <!-- yellow hose down to wand -->
  <path d="M70 90 Q40 100 40 130 Q40 150 55 158" stroke="#D4A017" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- spray gun grip -->
  <rect x="46" y="150" width="18" height="9" rx="3" fill="#232323" transform="rotate(-10 55 155)"/>
  <!-- lance/wand -->
  <path d="M60 150 L38 62" stroke="#C9CBCC" stroke-width="5" stroke-linecap="round"/>
  <!-- yellow cone nozzle -->
  <path d="M32 58 L44 58 L40 44 Z" fill="#D4A017"/>
  <ellipse cx="38" cy="58" rx="8" ry="4" fill="#D4A017"/>
</svg>
