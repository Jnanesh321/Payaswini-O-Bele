<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <!-- Background mark: stylized areca leaf (luminous night palette) -->
  <g transform="translate(118, 8)">
    <!-- Central stalk -->
    <line x1="22" y1="2" x2="22" y2="22" stroke="#8FCB6A" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Leaf fronds (left) -->
    <path d="M 22 6 Q 12 8 6 14" stroke="#8FCB6A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 22 10 Q 10 13 4 20" stroke="#A3D97F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 22 14 Q 12 18 8 24" stroke="#B8E59A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <!-- Leaf fronds (right) -->
    <path d="M 22 6 Q 32 8 38 14" stroke="#8FCB6A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 22 10 Q 34 13 40 20" stroke="#A3D97F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 22 14 Q 32 18 36 24" stroke="#B8E59A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <!-- Areca nut (warm gold, brighter for dark bg) -->
    <circle cx="22" cy="4" r="2.5" fill="#F0C040"/>
  </g>
  
  <!-- Wordmark: O Bele~ (luminous green on dark) -->
  <text x="140" y="68" font-family="Inter, sans-serif" font-size="42" font-weight="800" fill="#A3D97F" text-anchor="middle" letter-spacing="-0.5">
    O Bele
  </text>
  
  <!-- Custom tilde (~) as a curving leaf (bright warm gold) -->
  <path d="M 198 50 Q 206 42 214 50 Q 222 58 230 50" 
        stroke="#F0C040" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Tagline (warm cream for readability on dark) -->
  <text x="140" y="88" font-family="'Noto Sans Kannada', sans-serif" font-size="11" font-weight="500" fill="#D4B896" text-anchor="middle" letter-spacing="1">
    ಬೆಳೆಗಾರನ ಬೆಸುಗೆ
  </text>
</svg>
